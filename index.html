<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WasuChat | Anime Chat</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #ff00ff; 
            --primary-glow: rgba(255, 0, 255, 0.6);
            --secondary: #00ffff; 
            --secondary-glow: rgba(0, 255, 255, 0.6);
            --accent: #ffee00; 
            
            --bg-grad-1: #1a0033; --bg-grad-2: #330066; --bg-grad-3: #004d4d; --bg-grad-4: #003366;
            --glass-bg: rgba(0, 0, 0, 0.5);
            --glass-panel: rgba(15, 0, 30, 0.95);
            
            --text-main: #f0f0f0;
            --text-input: #fff;
            
            --bubble-own: linear-gradient(135deg, #ff00ff, #aa00ff);
            --bubble-own-text: #fff;
            --bubble-other: #3a3b3c;
            --bubble-other-text: #e4e6eb;
        }

        body.light-mode {
            --primary: #ff4d88; 
            --primary-glow: rgba(255, 77, 136, 0.4);
            --secondary: #00b3ff; 
            --secondary-glow: rgba(0, 179, 255, 0.4);
            --accent: #ffcc00; 
            
            --bg-grad-1: #ffe6f2; --bg-grad-2: #e6f7ff; --bg-grad-3: #fff0f5; --bg-grad-4: #e6ffff;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-panel: rgba(255, 255, 255, 0.95);
            
            --text-main: #333;
            --text-input: #333;
            
            --bubble-own: #0084ff; 
            --bubble-own-text: #fff;
            --bubble-other: #e4e6eb; 
            --bubble-other-text: #050505;
        }

        body {
            background: linear-gradient(-45deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-4));
            background-size: 400% 400%; animation: gradientBG 20s ease infinite;
            color: var(--text-main); font-family: 'M PLUS Rounded 1c', sans-serif; 
            height: 100vh; height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        @keyframes gradientBG { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }

        .theme-toggle-btn {
            background: var(--glass-bg); border: 2px solid var(--secondary);
            border-radius: 50%; width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; cursor: pointer; backdrop-filter: blur(5px);
            box-shadow: 0 0 10px var(--secondary-glow); transition: 0.3s;
        }
        .theme-toggle-btn:hover { transform: scale(1.1); }

        #login-screen { position: fixed; inset: 0; background: var(--glass-bg); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; overflow: hidden; }
        #sakura-container { position: absolute; inset: 0; pointer-events: none; z-index: 1001; }
        .sakura-petal { position: absolute; background: #ffb3d9; border-radius: 150% 0 150% 0; animation: fall linear infinite; opacity: 0.8; box-shadow: 0 0 5px #ffb3d9; }
        @keyframes fall { 0% { transform: translateY(-10vh) translateX(0) rotate(0deg) scale(0.5); } 100% { transform: translateY(110vh) translateX(20vw) rotate(360deg) scale(1.2); } }
        
        .login-content { z-index: 1002; display: flex; flex-direction: column; align-items: center; }
        .avatar-upload-container { position: relative; margin-bottom: 30px; cursor: pointer; transition: transform 0.2s; }
        .avatar-upload-container:hover { transform: scale(1.05); }
        .avatar-preview { width: 140px; height: 140px; border-radius: 50%; border: 4px solid var(--secondary); object-fit: cover; background: #2a0052; box-shadow: 0 0 30px var(--primary-glow); }
        .avatar-badge { position: absolute; bottom: 5px; right: 5px; background: var(--accent); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 0 15px var(--accent-glow); }
        .login-input { border: 2px solid var(--primary); background: var(--glass-bg); color: var(--text-input); padding: 15px; border-radius: 20px; font-size: 1.2rem; font-weight: 700; text-align: center; margin-bottom: 25px; outline: none; width: 85%; max-width: 280px; box-shadow: 0 0 10px var(--primary-glow); transition: 0.3s; }
        .btn-entrar { background: var(--primary); color: white; border: none; padding: 16px 50px; font-size: 1.3rem; font-weight: 900; border-radius: 25px; cursor: pointer; box-shadow: 0 5px 20px var(--primary-glow); transition: 0.3s ease; text-transform: uppercase; }

        header { background: var(--glass-bg); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(128, 128, 128, 0.2); padding: 12px 15px; display: none; justify-content: space-between; align-items: center; z-index: 100; }
        .title { font-weight: 900; font-size: 1.7rem; text-transform: uppercase; color: var(--text-main); text-shadow: 0 0 10px var(--primary-glow); animation: animePulse 2s infinite alternate ease-in-out; }
        @keyframes animePulse { 0% { transform: scale(1); text-shadow: 0 0 10px var(--secondary-glow); } 100% { transform: scale(1.05); text-shadow: 0 0 20px var(--primary-glow); } }

        #main-content { display: none; flex: 1; overflow: hidden; width: 100%; position: relative; }
        
        #wasutok-section { display: none; width: 100%; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; background: #000; position: relative; }
        #wasutok-feed { display: flex; flex-direction: column; }
        .v-tok-container { width: 100%; height: calc(100vh - 70px); scroll-snap-align: start; position: relative; border-bottom: 1px solid #1a1a1a; }
        .v-tok-video { width: 100%; height: 100%; object-fit: contain; }
        .v-tok-info { position: absolute; bottom: 30px; left: 15px; color: white; text-shadow: 0 2px 5px #000; pointer-events: none; z-index: 10; }
        .v-tok-name { font-weight: 900; font-size: 1.4rem; color: var(--secondary); }

        #bottom-nav { background: var(--glass-panel); backdrop-filter: blur(10px); border-top: 1px solid rgba(128, 128, 128, 0.2); height: 70px; display: none; justify-content: space-around; align-items: center; flex-shrink: 0; z-index: 200; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; font-weight: 800; font-size: 0.85rem; color: gray; transition: 0.3s;}
        .nav-btn.active { color: var(--primary); transform: scale(1.1); text-shadow: 0 0 10px var(--primary-glow); }
        .nav-btn i { font-size: 1.6rem; font-style: normal; margin-bottom: 2px; }

        #btn-upload-tok { position: fixed; bottom: 90px; right: 20px; background: var(--accent); border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 2.2rem; font-weight: 900; color: #000; display: none; align-items: center; justify-content: center; box-shadow: 0 5px 20px var(--accent-glow); z-index: 500; cursor: pointer; }

        #chat-container { flex: 1; display: flex; flex-direction: column; background: var(--glass-bg); backdrop-filter: blur(15px); width: 100%; height: 100%; }
        .chat-nav { background: var(--glass-panel); color: var(--text-main); padding: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; border-bottom: 1px solid rgba(128, 128, 128, 0.2); }
        .btn-regresar, .btn-chats-list, .btn-salir { border: none; padding: 8px 14px; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 0.8rem; }
        .btn-regresar { background: var(--accent); color: #000; display: none; }
        .btn-chats-list { background: var(--secondary); color: #000; }
        .btn-salir { background:#ff3333; color:white; margin-left: 10px; }

        #messages-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; } 
        
        .msg-container { display: flex; flex-direction: column; max-width: 75%; }
        .msg-own { align-self: flex-end; align-items: flex-end; }
        .msg-other { align-self: flex-start; align-items: flex-start; }
        .msg-bubble { padding: 10px 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg-own .msg-bubble { background: var(--bubble-own); color: var(--bubble-own-text); border-radius: 18px 18px 4px 18px; }
        .msg-other .msg-bubble { background: var(--bubble-other); color: var(--bubble-other-text); border-radius: 18px 18px 18px 4px; }

        #chats-list-overlay { position: absolute; inset: 0; background: var(--glass-panel); backdrop-filter: blur(15px); z-index: 100; display: none; flex-direction: column; padding: 20px; }
        #chats-list-overlay.active { display: flex; }
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid var(--secondary); padding-bottom: 10px; }
        .contact-item { display: flex; align-items: center; gap: 15px; padding: 15px; border: 2px solid rgba(128,128,128,0.2); border-radius: 20px; margin-bottom: 12px; cursor: pointer; background: var(--glass-bg); }
        .contact-item img { width: 55px; height: 55px; border-radius: 50%; object-fit:cover; }

        .input-bar { background: var(--glass-panel); padding: 12px; display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(128,128,128,0.2); }
        .input-field { flex: 1; min-width: 0; border: none; background: var(--glass-bg); color: var(--text-input); padding: 12px 15px; border-radius: 20px; font-weight: 600; outline: none; box-shadow: inset 0 0 5px rgba(0,0,0,0.1); }
        .btn-action { background: var(--secondary); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.3rem; }
        .btn-enviar-msg { background: var(--primary); color: white; border: none; padding: 0 20px; height: 45px; border-radius: 20px; font-weight: 900; cursor: pointer; }

        .popup-panel { background: var(--glass-panel); border-top: 2px solid var(--primary); display: none; height: 320px; overflow-y: auto; padding: 15px; }
        .popup-panel.active { display: flex; flex-direction: column; }
        .media-menu { background: var(--glass-panel); border-top: 2px solid var(--secondary); padding: 15px; display: none; flex-direction: column; gap: 12px; }
        .media-menu.show { display: flex; }
        .media-opt { background: var(--glass-bg); color: var(--text-main); border: 1px solid rgba(128,128,128,0.2); padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; }

        #toast-container { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
        .toast-notif { background: var(--primary); color: white; border-radius: 20px; padding: 12px; display: flex; align-items: center; gap: 12px; animation: fadeInUp 0.4s forwards; font-weight: 800;}
        @keyframes fadeInUp { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 3px; }
    </style>
</head>
<body>

    <audio id="audio-notif" src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-back-2575.mp3" preload="auto"></audio>
    <div id="toast-container"></div>

    <div id="login-screen">
        <div id="sakura-container"></div>
        
        <div style="position: absolute; top: 20px; right: 20px; z-index: 1003;">
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn-login">🌙</button>
        </div>

        <div class="login-content">
            <h1 class="title" style="margin-bottom: 30px; font-size: 2.2rem;">✨ WASUCHAT ✨</h1>
            <label for="avatar-input" class="avatar-upload-container">
                <img id="avatar-preview" class="avatar-preview" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Wasu">
                <div class="avatar-badge">📷</div>
            </label>
            <input type="file" id="avatar-input" hidden accept="image/*" onchange="comprimirYMostrarAvatar(event)">
            <input type="text" id="apodo-input" class="login-input" placeholder="Tu Apodo Otaku..." maxlength="15">
            <button class="btn-entrar" onclick="ingresarGremio()">✨ ENTRAR ✨</button>
        </div>
    </div>

    <header id="app-header">
        <div class="title" style="font-size: 1.3rem;">✨ WASUCHAT ✨</div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button class="theme-toggle-btn" style="width: 35px; height: 35px; font-size: 1rem;" onclick="toggleTheme()" id="theme-btn-header">🌙</button>
            <div id="user-info" style="display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--text-main);"></div>
            <button class="btn-salir" onclick="salirGremio()">Salir</button>
        </div>
    </header>

    <div id="main-content">
        <section id="wasutok-section">
            <div id="wasutok-feed"></div>
        </section>

        <div id="chats-list-overlay">
            <div class="list-header">
                <h2 style="font-weight: 900; color: var(--text-main);">📩 MIS CHATS</h2>
                <button class="btn-regresar" style="display:block;" onclick="toggleChatsList(false)">CERRAR</button>
            </div>
            <div id="contacts-container"></div>
        </div>

        <section id="chat-container">
            <div class="chat-nav">
                <span id="titulo-sala" style="color: var(--primary);">🌍 SALA GLOBAL</span>
                <div style="display: flex; gap: 10px;">
                    <button id="btn-chats" class="btn-chats-list" onclick="toggleChatsList(true)">📩 CHATS</button>
                    <button id="btn-regresar" class="btn-regresar" onclick="cambiarAChatGlobal()">🌍 VOLVER</button>
                </div>
            </div>

            <div id="messages-box"></div>
            
            <div class="input-bar">
                <button class="btn-action" onclick="toggleMenu('media')">➕</button>
                <button class="btn-action" style="background:var(--accent);" onclick="toggleMenu('emoji')">😀</button>
                <input type="text" id="chat-input" class="input-field" placeholder="Escribe un mensaje..." autocomplete="off">
                <button class="btn-enviar-msg" onclick="enviarTextoBoton()">➤</button>
            </div>

            <div id="global-popups" class="popup-panel"></div>
            <div id="global-media-menu" class="media-menu">
                <div class="media-opt" onclick="togglePopupInside('sticker')">🌟 Buscar GIFs Anime</div>
                <div class="media-opt" onclick="document.getElementById('img-input').click()">🖼️ Subir Foto</div>
            </div>
            <input type="file" id="img-input" hidden accept="image/*" onchange="subirImagen(this)">
        </section>
    </div>

    <div id="btn-upload-tok" onclick="document.getElementById('video-input').click()">➕</div>
    <input type="file" id="video-input" hidden accept="video/mp4,video/webm" onchange="subirVideoTok(this)">

    <nav id="bottom-nav">
        <div class="nav-btn" onclick="switchTab('wasutok')" id="tab-wasutok"><i>🎬</i>WASUTOK</div>
        <div class="nav-btn active" onclick="switchTab('chat')" id="tab-chat"><i>💬</i>CHAT</div>
    </nav>

    <script>
        // --- FUNCIÓN DE SEGURIDAD (Protección XSS) ---
        // Convierte caracteres especiales en entidades HTML seguras
        function sanitizarHTML(str) {
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML;
        }

        function applyTheme(isLight) {
            const btnLogin = document.getElementById('theme-btn-login');
            const btnHeader = document.getElementById('theme-btn-header');
            if(isLight) {
                document.body.classList.add('light-mode');
                btnLogin.innerText = '☀️'; btnHeader.innerText = '☀️';
            } else {
                document.body.classList.remove('light-mode');
                btnLogin.innerText = '🌙'; btnHeader.innerText = '🌙';
            }
        }

        function toggleTheme() {
            const isLight = !document.body.classList.contains('light-mode');
            localStorage.setItem('wasu_theme', isLight ? 'light' : 'dark');
            applyTheme(isLight);
        }

        if(localStorage.getItem('wasu_theme') === 'light') { applyTheme(true); }

        function createSakura() {
            const container = document.getElementById('sakura-container');
            if(!container) return;
            for(let i = 0; i < 30; i++) {
                let petal = document.createElement('div');
                petal.className = 'sakura-petal';
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.width = (Math.random() * 10 + 5) + 'px';
                petal.style.height = (Math.random() * 15 + 10) + 'px';
                petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
                petal.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(petal);
            }
        }
        createSakura(); 

        // --- LÓGICA DE FIREBASE Y SOCKET ---
        const firebaseConfig = {
            apiKey: "AIzaSyD3OO7nMrR3Hw0c0yfgi7bZc5B5MQg-EtQ",
            storageBucket: "chat-otaku-c7fe4.firebasestorage.app",
        };
        firebase.initializeApp(firebaseConfig);
        const storage = firebase.storage();

        const socket = io('https://servidor-otaku.onrender.com');

        let localUid = localStorage.getItem('otaku_uid') || 'user_' + Math.random().toString(36).substr(2, 9);
        let userAlias = localStorage.getItem('otaku_alias');
        let userPhoto = localStorage.getItem('otaku_avatar');
        let currentChatMode = "global";
        let targetUid = "";
        let mensajesGlobales = [];
        let chatsPrivados = {}; 

        window.onload = () => { if (userAlias) mostrarInterfazPrincipal(); };

        function comprimirYMostrarAvatar(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => { document.getElementById('avatar-preview').src = e.target.result; userPhoto = e.target.result; };
            reader.readAsDataURL(file);
        }

        function ingresarGremio() {
            const inputApodo = document.getElementById('apodo-input').value.trim();
            if (!inputApodo) return alert("¡Pon un apodo otaku!");
            
            // Sanitizamos el nombre de usuario desde que entra
            userAlias = sanitizarHTML(inputApodo);
            if(!userPhoto) userPhoto = `https://api.dicebear.com/7.x/adventurer/svg?seed=${userAlias}`;
            
            localStorage.setItem('otaku_uid', localUid);
            localStorage.setItem('otaku_alias', userAlias);
            localStorage.setItem('otaku_avatar', userPhoto);
            mostrarInterfazPrincipal();
        }

        function mostrarInterfazPrincipal() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-header').style.display = 'flex';
            document.getElementById('main-content').style.display = 'flex';
            document.getElementById('bottom-nav').style.display = 'flex'; 
            
            // Protegemos la foto en caso de manipulación manual de LocalStorage
            document.getElementById('user-info').innerHTML = `<img src="${encodeURI(userPhoto)}" style="width:38px;height:38px;border-radius:50%; object-fit:cover;">`;
            socket.emit('registrar_usuario', { uid: localUid, alias: userAlias });
            cambiarAChatGlobal();
        }

        function salirGremio() { localStorage.clear(); window.location.reload(); }

        function switchTab(tab) {
            if(tab === 'wasutok') {
                document.getElementById('chat-container').style.display = 'none';
                document.getElementById('wasutok-section').style.display = 'block';
                document.getElementById('tab-wasutok').classList.add('active');
                document.getElementById('tab-chat').classList.remove('active');
                document.getElementById('btn-upload-tok').style.display = 'flex';
                cerrarTodosPaneles();
            } else {
                document.getElementById('chat-container').style.display = 'flex';
                document.getElementById('wasutok-section').style.display = 'none';
                document.getElementById('tab-chat').classList.add('active');
                document.getElementById('tab-wasutok').classList.remove('active');
                document.getElementById('btn-upload-tok').style.display = 'none';
                scrollToBottom();
            }
        }

        async function subirVideoTok(input) {
            const file = input.files[0];
            if(!file) return;
            if(file.size > 20000000) return alert("Video demasiado grande (Máx 20MB)");

            const btn = document.getElementById('btn-upload-tok');
            btn.innerText = "⏳";
            
            try {
                const ref = storage.ref(`wasutok/${Date.now()}_${file.name}`);
                await ref.put(file);
                const url = await ref.getDownloadURL();
                
                socket.emit('mensaje_global', { text: url, type: 'video_tok', uid: localUid, autorNombre: userAlias, autorFoto: userPhoto });
                alert("¡Video compartido!");
            } catch (e) { alert("Error al subir el video"); }
            btn.innerText = "➕";
        }

        function agregarVideoFeed(m, isNew = false) {
            const feed = document.getElementById('wasutok-feed');
            const safeName = sanitizarHTML(m.autorNombre).toUpperCase();
            const safeUrl = encodeURI(m.text);
            
            const html = `
                <div class="v-tok-container">
                    <video class="v-tok-video" src="${safeUrl}" controls playsinline preload="metadata" style="background-color: #000;"></video>
                    <div class="v-tok-info" style="pointer-events: none;">
                        <div class="v-tok-name">@${safeName}</div>
                        <div style="font-weight:700; text-shadow: 0 1px 3px #000;">🎬 ¡Mira mi nuevo video!</div>
                    </div>
                </div>`;
            if(isNew) feed.insertAdjacentHTML('afterbegin', html);
            else feed.insertAdjacentHTML('beforeend', html);
        }

        socket.on('historial_global', (h) => { 
            mensajesGlobales = h.filter(m => m.type !== 'video_tok');
            const videosTok = h.filter(m => m.type === 'video_tok');
            if(currentChatMode === 'global') renderizarPantalla(mensajesGlobales); 
            const feed = document.getElementById('wasutok-feed');
            feed.innerHTML = '';
            videosTok.reverse().forEach(v => agregarVideoFeed(v));
        });

        socket.on('nuevo_mensaje_global', (m) => { 
            if(m.type === 'video_tok') { agregarVideoFeed(m, true); } 
            else { mensajesGlobales.push(m); if(currentChatMode === 'global') renderizarUnMensaje(m); }
        });

        socket.on('nuevo_mensaje_privado', (msg) => {
            const otroUid = msg.uid === localUid ? msg.targetUid : msg.uid;
            if(!chatsPrivados[otroUid]) {
                chatsPrivados[otroUid] = { nombre: (msg.uid === localUid) ? "Chat" : msg.autorNombre, foto: (msg.uid === localUid) ? "https://api.dicebear.com/7.x/adventurer/svg?seed="+otroUid : msg.autorFoto, msgs: [] };
            }
            chatsPrivados[otroUid].msgs.push(msg);
            if(currentChatMode === 'privado' && targetUid === otroUid) renderizarUnMensaje(msg);
        });

        socket.on('alerta_privada', (data) => {
            if (currentChatMode !== "privado" || targetUid !== data.deUid) {
                document.getElementById('audio-notif').play().catch(e=>e);
                const toast = document.createElement('div'); toast.className = 'toast-notif';
                
                const safeName = sanitizarHTML(data.deNombre);
                const safeFoto = encodeURI(data.deFoto);

                toast.innerHTML = `<img src="${safeFoto}" style="width:35px;height:35px;border-radius:50%;object-fit:cover;"> <span>MENSAJE DE ${safeName}</span>`;
                toast.onclick = () => { abrirPrivado(data.deUid, safeName); toast.remove(); };
                document.getElementById('toast-container').appendChild(toast);
                setTimeout(() => { if(toast) toast.remove()}, 4000);
            }
        });

        function toggleChatsList(show) {
            const overlay = document.getElementById('chats-list-overlay');
            const container = document.getElementById('contacts-container');
            if(show) {
                container.innerHTML = '';
                const uids = Object.keys(chatsPrivados);
                if(uids.length === 0) container.innerHTML = '<p style="text-align:center; color:var(--text-main); margin-top:30px;">Aún no tienes chats privados...</p>';
                uids.forEach(uid => {
                    const info = chatsPrivados[uid];
                    const item = document.createElement('div'); item.className = 'contact-item';
                    
                    const safeName = sanitizarHTML(info.nombre);
                    const safeFoto = encodeURI(info.foto);

                    item.innerHTML = `<img src="${safeFoto}"> <div style="font-weight:900; font-size:1.2rem; color:var(--text-main);">${safeName}</div>`;
                    item.onclick = () => { abrirPrivado(uid, safeName); toggleChatsList(false); };
                    container.appendChild(item);
                });
                overlay.classList.add('active');
            } else { overlay.classList.remove('active'); }
        }

        function cambiarAChatGlobal() {
            currentChatMode = "global"; targetUid = "";
            document.getElementById('titulo-sala').innerText = "🌍 SALA GLOBAL";
            document.getElementById('btn-regresar').style.display = "none";
            document.getElementById('btn-chats').style.display = "block";
            renderizarPantalla(mensajesGlobales);
        }

        function abrirPrivado(uid, nombre) {
            currentChatMode = "privado"; targetUid = uid;
            document.getElementById('titulo-sala').innerText = "🔒 " + sanitizarHTML(nombre).toUpperCase();
            document.getElementById('btn-regresar').style.display = "block";
            document.getElementById('btn-chats').style.display = "none";
            if(!chatsPrivados[uid]) chatsPrivados[uid] = { nombre: nombre, foto: '', msgs: [] };
            renderizarPantalla(chatsPrivados[uid].msgs);
        }

        function renderizarPantalla(lista) {
            const box = document.getElementById('messages-box'); box.innerHTML = '';
            lista.forEach(m => renderizarUnMensaje(m, false));
            box.scrollTop = box.scrollHeight;
        }

        function renderizarUnMensaje(d, scroll = true) {
            const box = document.getElementById('messages-box');
            const isMe = d.uid === localUid;
            
            // SANITIZAMOS EL MENSAJE Y EL NOMBRE
            let safeContent = '';
            const safeName = sanitizarHTML(d.autorNombre);

            if (d.type === 'image' || d.type === 'sticker') {
                safeContent = `<img src="${encodeURI(d.text)}" style="width:100%; border-radius:12px;">`;
            } else {
                safeContent = sanitizarHTML(d.text);
            }

            box.innerHTML += `<div class="msg-container ${isMe ? 'msg-own' : 'msg-other'}">
                ${!isMe ? `<span style="font-size:0.75rem; font-weight:700; color:gray; margin-bottom:3px; margin-left:10px; cursor:pointer;" onclick="abrirPrivado('${d.uid}','${safeName}')">${safeName}</span>` : ''}
                <div class="msg-bubble">${safeContent}</div>
            </div>`;
            
            if(scroll) box.scrollTop = box.scrollHeight;
        }

        function enviarTextoBoton() { enviarCore(document.getElementById('chat-input').value, 'text'); }
        function enviarCore(content, type) {
            if (!content.trim()) return;
            const data = { text: content, type: type, uid: localUid, autorNombre: userAlias, autorFoto: userPhoto };
            if (currentChatMode === "global") socket.emit('mensaje_global', data);
            else { data.targetUid = targetUid; socket.emit('mensaje_privado', data); }
            if (type === 'text') document.getElementById('chat-input').value = "";
            cerrarTodosPaneles();
        }

        function subirImagen(input) {
            const file = input.files[0]; if (!file) return;
            const task = storage.ref(`wasuchat/${Date.now()}`).put(file);
            task.on('state_changed', null, null, () => {
                task.snapshot.ref.getDownloadURL().then(url => enviarCore(url, 'image'));
            });
        }

        function cerrarTodosPaneles() { document.getElementById('global-popups').classList.remove('active'); document.getElementById('global-media-menu').classList.remove('show'); }
        function toggleMenu(m) { if (m === 'media') document.getElementById('global-media-menu').classList.toggle('show'); else togglePopupInside('emoji'); }

        function togglePopupInside(type) {
            const panel = document.getElementById('global-popups'); panel.innerHTML = '';
            if (type === 'emoji') {
                const picker = document.createElement('emoji-picker');
                picker.addEventListener('emoji-click', e => document.getElementById('chat-input').value += e.detail.unicode);
                panel.appendChild(picker);
            } else {
                panel.innerHTML = `<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;" id="g-res"></div>`;
                fetch(`https://g.tenor.com/v1/search?q=anime+sparkle&key=LIVDSRZULELA&limit=12`)
                .then(r => r.json()).then(data => {
                    data.results.forEach(gif => {
                        const img = document.createElement('img'); img.src = gif.media[0].gif.url; 
                        img.style = "width:100%; height:90px; object-fit:cover; border-radius:10px; cursor:pointer;";
                        img.onclick = () => { enviarCore(img.src, 'sticker'); cerrarTodosPaneles(); };
                        document.getElementById('g-res').appendChild(img);
                    });
                });
            }
            panel.classList.add('active');
        }
        function scrollToBottom() { const box = document.getElementById('messages-box'); box.scrollTop = box.scrollHeight; }
    </script>
</body>
</html>
